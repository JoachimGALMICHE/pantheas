<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamanisme Evenk · Pantheas</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --c: #e8743f; --c-light: #ffb07a; --c-deep: #5a1e0c; --c-glow: rgba(232,116,63,.45);
    --gold: #e2b84a; --gold-light: #fbe39a; --gold-glow: rgba(240,200,90,.5);
    --bg: #080504; --text: #efe5d6; --muted: #a39282;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: 'Cormorant Garamond', Georgia, serif; overflow-x: hidden; }

  #embers { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 110%, rgba(232,116,63,.22) 0%, rgba(90,30,12,.15) 35%, transparent 70%);
  }
  #arrive {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: radial-gradient(circle, var(--c) 0%, var(--c-deep) 60%, #000 100%);
    animation: fadeOut 1.6s ease forwards;
  }
  @keyframes fadeOut { to { opacity: 0; } }

  main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 1.6rem 2rem 4rem; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cinzel', serif; letter-spacing: .3em; font-size: .85rem; color: var(--muted);
  }
  .top a { color: var(--muted); text-decoration: none; }
  .top a:hover { color: var(--text); }

  header { text-align: center; margin: 3rem 0 3.5rem; }
  header .over { font-family: 'Cinzel', serif; letter-spacing: .5em; font-size: .9rem; color: var(--c); margin-right: -.5em; }
  h1 {
    font-family: 'Cinzel', serif; font-weight: 800; letter-spacing: .2em; margin: .6rem -.2em 0 0;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    color: var(--c-light); text-shadow: 0 0 24px var(--c-glow), 0 0 60px var(--c-glow);
  }
  .ornament { display: block; margin: 1.4rem auto 0; width: 220px; height: 14px; color: var(--c); opacity: .8; }
  header p { margin-top: 1.2rem; font-style: italic; font-size: 1.25rem; color: var(--muted); }

  /* ---------- Bibliothèque ---------- */
  .library { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2.2rem 1.8rem; }
  .book {
    --accent: var(--c); --accent-light: var(--c-light); --glow: var(--c-glow);
    position: relative; aspect-ratio: 3 / 4.2; cursor: pointer; border: none; text-align: center;
    color: var(--text); font: inherit;
    background:
      linear-gradient(90deg, rgba(0,0,0,.55) 0 7%, rgba(255,255,255,.04) 7% 8%, transparent 8%),
      radial-gradient(ellipse at 50% 30%, #4a2416 0%, #2a130b 60%, #180a05 100%);
    border-radius: 3px 8px 8px 3px;
    box-shadow: 0 10px 25px rgba(0,0,0,.6), inset 0 0 0 1px rgba(232,116,63,.25);
    padding: 1.4rem 1.2rem 1.2rem 1.9rem;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    transition: transform .45s ease, box-shadow .45s ease;
  }
  .book::after {
    content: ""; position: absolute; inset: 10px 10px 10px 22px; border: 1px solid rgba(255,176,122,.28);
    border-radius: 2px 5px 5px 2px; pointer-events: none;
  }
  .book:hover, .book:focus-visible {
    transform: translateY(-8px) rotate(-1deg); outline: none;
    box-shadow: 0 18px 40px rgba(0,0,0,.7), 0 0 35px var(--glow), inset 0 0 0 1px rgba(232,116,63,.6);
  }
  .book .num { font-family: 'Cinzel', serif; font-size: .8rem; letter-spacing: .35em; color: var(--accent); }
  .book .roman { font-family: 'Cinzel', serif; font-weight: 800; font-size: 2.4rem; color: var(--accent-light);
    text-shadow: 0 0 18px var(--glow); line-height: 1; }
  .book .title { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.05rem; letter-spacing: .06em; line-height: 1.35; }
  .book svg { width: 34px; height: 34px; color: var(--accent); opacity: .75; }

  /* Livre terminé : doré */
  .book.termine {
    --accent: var(--gold); --accent-light: var(--gold-light); --glow: var(--gold-glow);
    background:
      linear-gradient(90deg, rgba(0,0,0,.35) 0 7%, rgba(255,255,255,.12) 7% 8%, transparent 8%),
      linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 35%, transparent 65%, rgba(255,255,255,.08) 100%),
      radial-gradient(ellipse at 50% 30%, #6b4a12 0%, #3e2a08 60%, #231704 100%);
    box-shadow: 0 10px 25px rgba(0,0,0,.6), 0 0 22px rgba(240,200,90,.25), inset 0 0 0 1px rgba(240,200,90,.6);
  }
  .book.termine::after { border-color: rgba(251,227,154,.55); }
  .book.termine .title { color: var(--gold-light); }
  .book.termine:hover { box-shadow: 0 18px 40px rgba(0,0,0,.7), 0 0 45px var(--gold-glow), inset 0 0 0 1px var(--gold); }

  /* ---------- Lecteur ---------- */
  .reader {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(5,3,2,.82); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  .reader.open { opacity: 1; pointer-events: auto; }
  .page {
    --accent: var(--c); --accent-light: var(--c-light); --glow: var(--c-glow);
    position: relative; width: min(860px, 94vw); max-height: 88vh; overflow-y: auto;
    background: linear-gradient(180deg, #1d120c 0%, #140c08 100%);
    border: 1px solid rgba(232,116,63,.35); border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 60px rgba(232,116,63,.12);
    padding: 3rem clamp(1.2rem, 5vw, 4rem) 2.5rem;
    transform: translateY(20px) scale(.97); transition: transform .5s ease;
    scrollbar-width: thin; scrollbar-color: var(--c-deep) transparent;
  }
  .page.termine { --accent: var(--gold); --accent-light: var(--gold-light); --glow: var(--gold-glow); border-color: rgba(240,200,90,.5); }
  .reader.open .page { transform: none; }
  .page > .num { text-align: center; font-family: 'Cinzel', serif; letter-spacing: .45em; color: var(--accent); font-size: .85rem; }
  .page h2 {
    text-align: center; font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: .12em;
    font-size: clamp(1.6rem, 3.5vw, 2.4rem); color: var(--accent-light); margin: .5rem 0 0;
    text-shadow: 0 0 20px var(--glow);
  }
  .page .ornament { color: var(--accent); margin: 1.2rem auto 2rem; }
  .content { font-size: 1.25rem; line-height: 1.75; }
  .content > p { margin-bottom: 1rem; }
  .content .empty { text-align: center; font-style: italic; color: var(--muted); padding: 2rem 0; }

  .close { position: absolute; top: 1rem; right: 1.2rem; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.8rem; line-height: 1; }
  .close:hover { color: var(--text); }
  .page-nav { display: flex; justify-content: space-between; margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid rgba(232,116,63,.2); }
  .page-nav button { background: none; border: none; cursor: pointer; color: var(--muted); font-family: 'Cinzel', serif; letter-spacing: .15em; font-size: .85rem; }
  .page-nav button:hover:not(:disabled) { color: var(--accent-light); }
  .page-nav button:disabled { opacity: .2; cursor: default; }

  /* ---------- Chapitres ---------- */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    font-size: 1rem; color: var(--muted); font-style: italic; margin-bottom: 1.2rem; }
  .btn {
    background: none; cursor: pointer; font-family: 'Cinzel', serif; letter-spacing: .12em; font-size: .78rem;
    color: var(--accent-light); border: 1px solid rgba(232,116,63,.4); padding: .55rem 1rem; border-radius: 3px; transition: all .3s;
  }
  .btn:hover { border-color: var(--accent); background: rgba(232,116,63,.1); }
  .btn.ghost { border-color: transparent; color: var(--muted); padding: .4rem .6rem; }
  .btn.ghost:hover { color: var(--text); background: none; }
  .btn.danger { color: #e88; }

  .chap { border-top: 1px solid rgba(232,116,63,.18); }
  .chap:last-of-type { border-bottom: 1px solid rgba(232,116,63,.18); }
  .chap-head {
    width: 100%; display: flex; align-items: center; gap: 1rem; padding: 1rem .3rem;
    background: none; border: none; cursor: pointer; color: var(--text); text-align: left; font: inherit;
  }
  .chap-head:hover .chap-name { color: var(--accent-light); }
  .chap-num { font-family: 'Cinzel', serif; color: var(--accent); min-width: 3.2rem; font-size: 1rem; letter-spacing: .05em; }
  .chap-name { flex: 1; font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: .05em; transition: color .3s; }
  .chap-count { font-size: .95rem; color: var(--muted); font-style: italic; }
  .chev { color: var(--accent); transition: transform .3s; font-size: 1.3rem; }
  .chap.open .chev { transform: rotate(90deg); }
  .chap-body { display: none; padding: 0 0 1.4rem 4.2rem; }
  .chap.open .chap-body { display: block; }
  @media (max-width: 600px) { .chap-body { padding-left: .3rem; } }
  .empty-chap { font-style: italic; color: var(--muted); font-size: 1.05rem; margin-bottom: 1rem; }

  .priere {
    background: rgba(255,255,255,.025); border-left: 2px solid var(--accent);
    padding: 1.1rem 1.3rem; margin-bottom: 1.1rem; border-radius: 0 4px 4px 0;
  }
  .priere h4 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.1rem; color: var(--accent-light); letter-spacing: .04em; }
  .priere .cible { font-style: italic; color: var(--muted); font-size: 1.02rem; margin: .2rem 0 .8rem; }
  .priere .cible b { font-style: normal; font-weight: 600; color: var(--accent); font-family: 'Cinzel', serif; font-size: .75rem; letter-spacing: .15em; margin-right: .4rem; }
  .priere .texte { white-space: pre-line; font-size: 1.18rem; line-height: 1.8; }
  .priere .actions { display: flex; gap: .3rem; justify-content: flex-end; margin-top: .6rem; }

  .form { background: rgba(232,116,63,.05); border: 1px solid rgba(232,116,63,.3); border-radius: 4px; padding: 1.2rem; margin-bottom: 1.1rem; }
  .form label { display: block; font-family: 'Cinzel', serif; font-size: .75rem; letter-spacing: .18em; color: var(--accent); margin: .8rem 0 .35rem; }
  .form label:first-child { margin-top: 0; }
  .form input, .form textarea {
    width: 100%; background: rgba(0,0,0,.35); border: 1px solid rgba(232,116,63,.25); border-radius: 3px;
    color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; padding: .55rem .75rem;
  }
  .form textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
  .form input:focus, .form textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px rgba(232,116,63,.2); }
  .form .row { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1rem; }
  .form .err { color: #e99; font-size: 1rem; font-style: italic; margin-top: .5rem; }
</style>
</head>
<body>
<div id="arrive"></div>
<canvas id="embers"></canvas>

<main>
  <div class="top">
    <a href="index.html">← SALLE DES PORTAILS</a>
    <span>PANTHEAS</span>
  </div>
  <header>
    <div class="over">PORTAIL</div>
    <h1>CHAMANISME EVENK</h1>
    <svg class="ornament" viewBox="0 0 220 14" fill="none" stroke="currentColor">
      <line x1="0" y1="7" x2="90" y2="7"/><line x1="130" y1="7" x2="220" y2="7"/>
      <path d="M100 7 L110 1 L120 7 L110 13 Z"/><circle cx="110" cy="7" r="2" fill="currentColor"/>
    </svg>
    <p>Les douze livres de la taïga</p>
  </header>
  <section class="library" id="library"></section>
</main>

<div class="reader" id="reader" aria-hidden="true">
  <article class="page" id="page" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <button class="close" id="close" aria-label="Fermer">×</button>
    <div class="num" id="readerNum"></div>
    <h2 id="readerTitle"></h2>
    <svg class="ornament" viewBox="0 0 220 14" fill="none" stroke="currentColor">
      <line x1="0" y1="7" x2="90" y2="7"/><line x1="130" y1="7" x2="220" y2="7"/>
      <path d="M100 7 L110 1 L120 7 L110 13 Z"/><circle cx="110" cy="7" r="2" fill="currentColor"/>
    </svg>
    <div class="content" id="readerContent"></div>
    <div class="page-nav">
      <button id="prevBook">‹ LIVRE PRÉCÉDENT</button>
      <button id="nextBook">LIVRE SUIVANT ›</button>
    </div>
  </article>
</div>

<script>
/* =========================================================
   LES DOUZE LIVRES
   - termine: true  → le livre devient doré
   - contenu        → texte libre (HTML simple) pour les livres sans chapitres
   - chapitres      → liste de chapitres où l'on peut ajouter des entrées
                      (Titre + But/cible + Texte) directement depuis la page
   ========================================================= */
const LIVRES = [
  { titre: "Cosmologie",                 icone: "cosmos",   termine: false, contenu: `` },
  { titre: "Divinités et entités",       icone: "esprit",   termine: false, contenu: `` },
  { titre: "Mythes et légendes",         icone: "parole",   termine: false, contenu: `` },
  { titre: "Lieux spirituels",           icone: "montagne", termine: false, contenu: `` },
  { titre: "Le chamane",                 icone: "tambour",  termine: false, contenu: `` },
  { titre: "Divination et connaissance", icone: "oeil",     termine: false, contenu: `` },
  { titre: "Voyages spirituels",         icone: "arbre",    termine: false, contenu: `` },
  { titre: "Prière et invocation",       icone: "souffle",  termine: false,
    fichier: "prieres.json",            // fichier où sont publiées les prières
    nomEntree: "prière",
    chapitres: [
      "Prières du matin",
      "Prières du soir",
      "Prières aux ancêtres",
      "Prières à la nature",
      "Prières aux esprits protecteurs",
      "Prières pour les animaux",
      "Prières de guérison",
      "Prières de protection",
      "Paroles de gratitude",
    ] },
  { titre: "Offrandes et rituels",       icone: "feu",      termine: false, contenu: `` },
  { titre: "Pratiques quotidiennes",     icone: "soleil",   termine: false, contenu: `` },
  { titre: "Plantes et éléments",        icone: "plante",   termine: false, contenu: `` },
  { titre: "Règles et transmission",     icone: "cercle",   termine: false, contenu: `` },
];

/* Chiffres romains ésotériques : on ne retire rien (IIII, VIIII) */
function romain(n) {
  const t = [[1000,"M"],[500,"D"],[100,"C"],[50,"L"],[10,"X"],[5,"V"],[1,"I"]];
  let s = ""; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s;
}

const ICONES = {
  cosmos:   '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="21"/>',
  esprit:   '<path d="M12 3c4 3 4 7 0 10c-4-3-4-7 0-10z"/><path d="M5 21c2-5 12-5 14 0"/>',
  parole:   '<path d="M4 5h16v10H9l-5 4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="12" x2="13" y2="12"/>',
  montagne: '<path d="M2 20l7-12 4 6 3-4 6 10z"/>',
  tambour:  '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><line x1="12" y1="3" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="21"/><line x1="3" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="21" y2="12"/>',
  oeil:     '<path d="M2 12c4-6 16-6 20 0c-4 6-16 6-20 0z"/><circle cx="12" cy="12" r="3"/>',
  arbre:    '<line x1="12" y1="2" x2="12" y2="22"/><path d="M12 7l-5-4M12 7l5-4M12 17l-5 4M12 17l5 4M12 12H5M12 12h7"/>',
  souffle:  '<path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 15h15a3 3 0 1 1-3 3"/>',
  feu:      '<path d="M12 2c3 5 6 7 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6c0 3 1 4 3 4c0-4-1-6 0-10z"/>',
  soleil:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  plante:   '<path d="M12 22V10"/><path d="M12 14c-5 0-7-4-7-8c5 0 7 4 7 8z"/><path d="M12 10c0-4 3-7 7-7c0 4-3 7-7 7z"/>',
  cercle:   '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="18" cy="15" r="1.5" fill="currentColor"/><circle cx="6" cy="15" r="1.5" fill="currentColor"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONES[k]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- Bibliothèque ---------- */
const library = document.getElementById('library');
LIVRES.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'book' + (l.termine ? ' termine' : '');
  b.innerHTML = `
    <span class="num">LIVRE</span>
    <span class="roman">${romain(i + 1)}</span>
    ${icon(l.icone)}
    <span class="title">${l.titre}</span>`;
  b.onclick = () => openBook(i);
  library.appendChild(b);
});

/* =========================================================
   ENTRÉES DES CHAPITRES (prières…)
   Enregistrées dans ce navigateur. Le bouton « Exporter » télécharge
   le fichier (ex. prieres.json) à déposer sur GitHub à côté de cette page :
   tout le monde verra alors les prières.
   ========================================================= */
const DATA = {};      // { indexLivre: { indexChapitre: [ {titre, cible, texte} ] } }
const storeKey = i => `pantheas-evenk-livre-${i + 1}`;

async function loadData(i) {
  const l = LIVRES[i];
  if (DATA[i]) return;
  try { const s = localStorage.getItem(storeKey(i)); if (s) { DATA[i] = JSON.parse(s); return; } } catch (e) {}
  try {
    const r = await fetch(l.fichier, { cache: "no-store" });
    DATA[i] = r.ok ? await r.json() : {};
  } catch (e) { DATA[i] = {}; }
}
function saveData(i) { try { localStorage.setItem(storeKey(i), JSON.stringify(DATA[i])); } catch (e) {} }
function exportData(i) {
  const blob = new Blob([JSON.stringify(DATA[i], null, 2)], { type: "application/json" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = LIVRES[i].fichier; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const ui = { open: new Set(), adding: null, editing: null, confirmDel: null, error: "" };

function formHTML(p = {}) {
  return `
  <div class="form">
    <label>TITRE</label>
    <input data-f="titre" value="${esc(p.titre)}" placeholder="Ex. : Salut au soleil levant">
    <label>BUT / CIBLE</label>
    <input data-f="cible" value="${esc(p.cible)}" placeholder="Ex. : Remercier le soleil, ouvrir la journée">
    <label>TEXTE</label>
    <textarea data-f="texte" placeholder="Le texte de la prière…">${esc(p.texte)}</textarea>
    ${ui.error ? `<div class="err">${ui.error}</div>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="cancel">Annuler</button>
      <button class="btn" data-act="save">Enregistrer</button>
    </div>
  </div>`;
}

function renderChapitres(i) {
  const l = LIVRES[i], d = DATA[i] || {}, nom = l.nomEntree || "entrée";
  const total = Object.values(d).reduce((n, a) => n + a.length, 0);
  const box = document.getElementById('readerContent');
  box.innerHTML = `
    <div class="toolbar">
      <span>${total} ${nom}${total > 1 ? "s" : ""} au total</span>
      <button class="btn" data-act="export" title="Télécharge ${l.fichier} à déposer sur GitHub">Exporter pour GitHub</button>
    </div>
    ${l.chapitres.map((c, ci) => {
      const list = d[ci] || [];
      return `
      <section class="chap ${ui.open.has(ci) ? "open" : ""}" data-ci="${ci}">
        <button class="chap-head" data-act="toggle">
          <span class="chap-num">${romain(ci + 1)}</span>
          <span class="chap-name">${esc(c)}</span>
          <span class="chap-count">${list.length}</span>
          <span class="chev">›</span>
        </button>
        <div class="chap-body">
          ${list.length ? "" : `<p class="empty-chap">Aucune ${nom} pour l'instant.</p>`}
          ${list.map((p, pi) => ui.editing === `${ci}-${pi}` ? formHTML(p) : `
            <div class="priere" data-pi="${pi}">
              <h4>${esc(p.titre)}</h4>
              ${p.cible ? `<div class="cible"><b>BUT</b>${esc(p.cible)}</div>` : ""}
              <div class="texte">${esc(p.texte)}</div>
              <div class="actions">
                <button class="btn ghost" data-act="edit">Modifier</button>
                <button class="btn ghost ${ui.confirmDel === `${ci}-${pi}` ? "danger" : ""}" data-act="del">
                  ${ui.confirmDel === `${ci}-${pi}` ? "Confirmer la suppression" : "Supprimer"}</button>
              </div>
            </div>`).join("")}
          ${ui.adding === ci ? formHTML() : (ui.editing?.startsWith(ci + "-") ? "" : `<button class="btn" data-act="add">+ Ajouter une ${nom}</button>`)}
        </div>
      </section>`;
    }).join("")}`;
  const f = box.querySelector('.form [data-f="titre"]');
  if (f) f.focus();
}

document.getElementById('readerContent').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const i = current, l = LIVRES[i]; if (!l.chapitres) return;
  const chap = btn.closest('.chap'), ci = chap ? +chap.dataset.ci : null;
  const card = btn.closest('.priere'), pi = card ? +card.dataset.pi : null;
  const d = DATA[i] ||= {};
  const act = btn.dataset.act;
  if (act !== "del") ui.confirmDel = null;

  if (act === "export") return exportData(i);
  if (act === "toggle") { ui.open.has(ci) ? ui.open.delete(ci) : ui.open.add(ci); }
  if (act === "add")    { ui.adding = ci; ui.editing = null; ui.error = ""; }
  if (act === "edit")   { ui.editing = `${ci}-${pi}`; ui.adding = null; ui.error = ""; }
  if (act === "cancel") { ui.adding = ui.editing = null; ui.error = ""; }
  if (act === "del") {
    if (ui.confirmDel === `${ci}-${pi}`) { d[ci].splice(pi, 1); saveData(i); ui.confirmDel = null; }
    else ui.confirmDel = `${ci}-${pi}`;
  }
  if (act === "save") {
    const form = btn.closest('.form');
    const val = k => form.querySelector(`[data-f="${k}"]`).value.trim();
    const p = { titre: val("titre"), cible: val("cible"), texte: val("texte") };
    if (!p.titre || !p.texte) { ui.error = "Il faut au moins un titre et un texte.";
      // garder ce qui a été tapé
      if (ui.editing) { const [a, b] = ui.editing.split("-").map(Number); renderWith(i, () => Object.assign({}, d[a][b], p)); return; }
      return renderDraft(i, p);
    }
    d[ci] ||= [];
    if (ui.editing) { const [, b] = ui.editing.split("-").map(Number); d[ci][b] = p; }
    else d[ci].push(p);
    saveData(i); ui.adding = ui.editing = null; ui.error = "";
  }
  renderChapitres(i);
});
/* garde le texte saisi quand il manque un champ */
function renderDraft(i, p) { renderChapitres(i); fill(p); }
function renderWith(i, get) { renderChapitres(i); fill(get()); }
function fill(p) {
  const form = document.querySelector('#readerContent .form'); if (!form) return;
  for (const k of ["titre", "cible", "texte"]) form.querySelector(`[data-f="${k}"]`).value = p[k] || "";
}

/* ---------- Lecteur ---------- */
const reader = document.getElementById('reader'), page = document.getElementById('page');
let current = 0;
async function openBook(i) {
  current = i;
  const l = LIVRES[i];
  page.classList.toggle('termine', !!l.termine);
  document.getElementById('readerNum').textContent = `LIVRE ${romain(i + 1)}`;
  document.getElementById('readerTitle').textContent = l.titre;
  document.getElementById('prevBook').disabled = i === 0;
  document.getElementById('nextBook').disabled = i === LIVRES.length - 1;
  ui.adding = ui.editing = ui.confirmDel = null; ui.error = ""; ui.open.clear();
  const box = document.getElementById('readerContent');
  if (l.chapitres) { box.innerHTML = ""; await loadData(i); if (current === i) renderChapitres(i); }
  else box.innerHTML = l.contenu.trim() ? l.contenu : `<p class="empty">Les pages de ce livre restent encore à écrire…</p>`;
  reader.classList.add('open'); reader.setAttribute('aria-hidden', 'false');
  page.scrollTop = 0;
  history.replaceState(null, '', `#livre-${i + 1}`);
}
function closeBook() {
  reader.classList.remove('open'); reader.setAttribute('aria-hidden', 'true');
  history.replaceState(null, '', location.pathname);
}
document.getElementById('close').onclick = closeBook;
reader.addEventListener('click', e => { if (e.target === reader) closeBook(); });
document.getElementById('prevBook').onclick = () => openBook(Math.max(0, current - 1));
document.getElementById('nextBook').onclick = () => openBook(Math.min(LIVRES.length - 1, current + 1));
addEventListener('keydown', e => {
  if (!reader.classList.contains('open')) return;
  if (e.target.closest('input, textarea')) return;   // ne pas gêner la saisie
  if (e.key === 'Escape') closeBook();
  if (e.key === 'ArrowRight' && current < LIVRES.length - 1) openBook(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) openBook(current - 1);
});
const m = location.hash.match(/^#livre-(\d+)$/);
if (m && LIVRES[m[1] - 1]) openBook(m[1] - 1);

/* ---------- Braises ---------- */
const cv = document.getElementById('embers'), cx = cv.getContext('2d');
let W, H, sparks = [];
function resize() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
resize(); addEventListener('resize', resize);
function spark() {
  return { x: Math.random() * W, y: H + 10, vy: -(.3 + Math.random() * 1.1) * devicePixelRatio,
    r: (.6 + Math.random() * 1.8) * devicePixelRatio, life: 0, max: 300 + Math.random() * 500, seed: Math.random() * 100 };
}
(function loop() {
  cx.clearRect(0, 0, W, H);
  if (sparks.length < 70 && Math.random() < .5) sparks.push(spark());
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life++;
    s.y += s.vy; s.x += Math.sin((s.life + s.seed * 50) * .02) * .4 * devicePixelRatio;
    const a = Math.sin(Math.PI * s.life / s.max);
    cx.fillStyle = `rgba(255,${140 + Math.random() * 60 | 0},80,${a * .8})`;
    cx.shadowColor = 'rgba(255,120,50,.9)'; cx.shadowBlur = 8 * devicePixelRatio;
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fill();
    if (s.life > s.max || s.y < -10) sparks.splice(i, 1);
  }
  requestAnimationFrame(loop);
})();
</script>
